<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title description">
  <title id="title">Conference badge system architecture</title>
  <desc id="description">Event producers send messages through an application queue to the badge application task, which controls output modules and shared display state.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #0f172a; }
      .section { font: 700 17px Arial, sans-serif; fill: #475569; letter-spacing: 0.4px; }
      .label { font: 700 19px Arial, sans-serif; fill: #0f172a; }
      .detail { font: 15px Arial, sans-serif; fill: #475569; }
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 2; rx: 6; }
      .primary { fill: #eff6ff; stroke: #2563eb; stroke-width: 2.5; rx: 6; }
      .queue { fill: #f8fafc; stroke: #0f766e; stroke-width: 2.5; rx: 6; }
      .state { fill: #fefce8; stroke: #a16207; stroke-width: 2.5; rx: 6; }
      .arrow { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="650" fill="#f8fafc"/>
  <text class="title" x="600" y="48" text-anchor="middle">System Architecture</text>

  <text class="section" x="170" y="95" text-anchor="middle">EVENT PRODUCERS</text>
  <text class="section" x="550" y="95" text-anchor="middle">COORDINATION</text>
  <text class="section" x="1000" y="95" text-anchor="middle">MODULE COMMANDS</text>

  <rect class="box" x="50" y="145" width="240" height="82"/>
  <text class="label" x="170" y="180" text-anchor="middle">Buttons Task</text>
  <text class="detail" x="170" y="205" text-anchor="middle">GPIO input events</text>

  <rect class="box" x="50" y="295" width="240" height="82"/>
  <text class="label" x="170" y="330" text-anchor="middle">Infrared Task</text>
  <text class="detail" x="170" y="355" text-anchor="middle">TX and RX status events</text>

  <rect class="queue" x="400" y="220" width="300" height="92"/>
  <text class="label" x="550" y="258" text-anchor="middle">Application Event Queue</text>
  <text class="detail" x="550" y="284" text-anchor="middle">24 ordered badge_event_t entries</text>

  <rect class="primary" x="400" y="385" width="300" height="92"/>
  <text class="label" x="550" y="423" text-anchor="middle">badge_app Task</text>
  <text class="detail" x="550" y="449" text-anchor="middle">Handles events and coordinates modules</text>

  <rect class="box" x="865" y="120" width="280" height="78"/>
  <text class="label" x="1005" y="153" text-anchor="middle">Buzzer Command Queue</text>
  <text class="detail" x="1005" y="177" text-anchor="middle">Buzzer task drives GPIO15</text>

  <rect class="box" x="865" y="235" width="280" height="78"/>
  <text class="label" x="1005" y="268" text-anchor="middle">IR Command Queue</text>
  <text class="detail" x="1005" y="292" text-anchor="middle">IR task drives LEDC on GPIO17</text>

  <rect class="box" x="865" y="350" width="280" height="78"/>
  <text class="label" x="1005" y="383" text-anchor="middle">RGB Module</text>
  <text class="detail" x="1005" y="407" text-anchor="middle">RMT drives WS2812 on GPIO38</text>

  <rect class="state" x="400" y="535" width="300" height="82"/>
  <text class="label" x="550" y="569" text-anchor="middle">Shared State + Mutex</text>
  <text class="detail" x="550" y="594" text-anchor="middle">Consistent display snapshot</text>

  <rect class="box" x="865" y="535" width="280" height="82"/>
  <text class="label" x="1005" y="569" text-anchor="middle">OLED Task</text>
  <text class="detail" x="1005" y="594" text-anchor="middle">Refreshes every 250 ms</text>

  <path class="arrow" d="M 290 186 H 345 V 246 H 400"/>
  <path class="arrow" d="M 290 336 H 345 V 286 H 400"/>
  <path class="arrow" d="M 550 312 V 385"/>

  <path class="arrow" d="M 700 414 H 775 V 159 H 865"/>
  <path class="arrow" d="M 700 431 H 795 V 274 H 865"/>
  <path class="arrow" d="M 700 448 H 815 V 389 H 865"/>
  <path class="arrow" d="M 550 477 V 535"/>
  <path class="arrow" d="M 700 576 H 865"/>
</svg>
